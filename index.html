<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>甜宝爱心 · 戒烟助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 去掉手机点击灰色背景 */
        }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            padding: 12px;
        }

        .widget {
            width: 100%;
            max-width: 450px;
            background: rgba(20, 30, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 20px 18px 26px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFB7C5, #FF6F91);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .day-badge {
            background: #00000066;
            border-radius: 60px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffb7c5;
        }

        .goal-switch {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 16px 0 12px;
        }
        .goal-btn {
            background: #1e2e38;
            border: none;
            padding: 10px 0;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #cce3ed;
            cursor: pointer;
            flex: 1;
            transition: 0.1s;
        }
        .goal-btn.active {
            background: #ff6f91;
            color: white;
            box-shadow: 0 0 10px #ff6f91aa;
        }
        .goal-btn:active {
            transform: scale(0.96);
        }

        .heart-container {
            display: flex;
            justify-content: center;
            margin: 8px 0 10px;
            animation: heartbeat 1.2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.08); }
            35% { transform: scale(1.1); }
            45% { transform: scale(1.05); }
            55% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        canvas {
            width: 150px;
            height: 135px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .heart-percent {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffb7c5;
            background: #1e2a2faa;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 60px;
            margin: 8px auto 12px;
        }

        .target-show {
            font-size: 0.85rem;
            background: #00000055;
            border-radius: 40px;
            padding: 6px 12px;
            display: inline-block;
            margin-bottom: 10px;
            color: #ffecb3;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin: 20px 0 16px;
        }
        .stat {
            flex: 1;
            background: #0e191faa;
            border-radius: 28px;
            padding: 12px 6px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: #f3b35c;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #9ab7c6;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .tip {
            background: #0f1a1fcc;
            border-radius: 28px;
            padding: 12px 14px;
            font-size: 0.8rem;
            color: #cce3ed;
            border-left: 4px solid #ff6f91;
            margin-top: 14px;
            text-align: left;
        }

        .withdrawal-box {
            background: linear-gradient(135deg, rgba(255, 111, 145, 0.1), rgba(255, 183, 197, 0.05));
            border-radius: 28px;
            padding: 16px;
            margin-top: 14px;
            border: 1px solid rgba(255, 111, 145, 0.3);
            text-align: center;
        }
        .withdrawal-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .withdrawal-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ff6f91, #ffb7c5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(255, 111, 145, 0.3);
        }
        .withdrawal-title {
            font-size: 1rem;
            font-weight: bold;
            color: #ffb7c5;
        }
        .withdrawal-current-stage {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px 14px;
        }
        .withdrawal-stage-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #f3b35c;
            margin-bottom: 8px;
        }
        .withdrawal-stage-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffb7c5;
            margin-bottom: 10px;
        }
        .withdrawal-stage-desc {
            font-size: 0.85rem;
            color: #cce3ed;
            line-height: 1.6;
            text-align: left;
        }
        .blessing-box {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 60px;
            padding: 10px 16px;
            margin-top: 18px;
            overflow: hidden;
        }
        .blessing-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: #b13e5c;
            text-align: center;
            line-height: 1.3;
            transition: opacity 0.5s ease;
        }
        .blessing-text.fade-out {
            opacity: 0;
        }
        .blessing-text.fade-in {
            opacity: 1;
        }

        .timer-box {
            background: #0e191faa;
            border-radius: 28px;
            padding: 14px 10px;
            margin: 14px 0;
            text-align: center;
        }
        .timer-label {
            font-size: 0.75rem;
            color: #9ab7c6;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .timer-display {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .timer-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 42px;
        }
        .timer-number {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ff6f91;
            background: #1e2a38;
            border-radius: 10px;
            padding: 4px 8px;
            min-width: 42px;
            font-variant-numeric: tabular-nums;
        }
        .timer-unit-label {
            font-size: 0.6rem;
            color: #9ab7c6;
            margin-top: 4px;
        }
        .timer-sep {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ff6f91;
            align-self: flex-start;
            padding-top: 4px;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            color: #8aaebb;
        }
    </style>
</head>
<body>
<div class="widget">
    <div class="widget-header">
        <span class="title">❤️ 想哥的戒烟爱心</span>
        <span class="day-badge" id="dayCount">第0天</span>
    </div>

    <div class="goal-switch">
        <button class="goal-btn" data-goal="30">🎯 30天</button>
        <button class="goal-btn" data-goal="90">🏆 90天</button>
        <button class="goal-btn" data-goal="permanent">🌟 永久</button>
    </div>
    <div class="target-show" id="targetDesc">当前目标: 30天</div>

    <div class="heart-container">
        <canvas id="heartCanvas" width="200" height="180" style="width:150px; height:135px;"></canvas>
    </div>
    <div class="heart-percent" id="heartPercentText">0%</div>

    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="avoidedCigs">0</div>
            <div class="stat-label">🚬 避免吸烟(支)</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="savedMoney">0</div>
            <div class="stat-label">💰 节省(元)</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="progressPercent">0%</div>
            <div class="stat-label">完成度</div>
        </div>
    </div>

    <div class="timer-box">
        <div class="timer-label">⏱️ 精确计时</div>
        <div class="timer-display">
            <div class="timer-unit">
                <div class="timer-number" id="timerDays">00</div>
                <div class="timer-unit-label">天</div>
            </div>
            <div class="timer-sep">:</div>
            <div class="timer-unit">
                <div class="timer-number" id="timerHours">00</div>
                <div class="timer-unit-label">时</div>
            </div>
            <div class="timer-sep">:</div>
            <div class="timer-unit">
                <div class="timer-number" id="timerMins">00</div>
                <div class="timer-unit-label">分</div>
            </div>
            <div class="timer-sep">:</div>
            <div class="timer-unit">
                <div class="timer-number" id="timerSecs">00</div>
                <div class="timer-unit-label">秒</div>
            </div>
        </div>
    </div>

    <div class="tip" id="healthTip">
        💪 想哥加油！第4天：尼古丁基本清除，爱心正在跳动～
    </div>

    <div class="withdrawal-box" id="withdrawalBox">
        <div class="withdrawal-header">
            <div class="withdrawal-icon">🧬</div>
            <div class="withdrawal-title">当前身体状态</div>
        </div>
        <div class="withdrawal-current-stage" id="currentStage">
            <!-- 当前阶段信息 -->
        </div>
    </div>

    <div class="blessing-box">
        <div class="blessing-text" id="blessingText">❤️ 祝想哥戒烟成功！每一天都是胜利 ❤️</div>
    </div>

    <footer>
        ❤️ 心跳爱心 · 专属想哥 | 戒烟始于 2026-05-29 | 每天20支烟 | 一包16元(20支)
    </footer>
</div>

<script>
    // ========= 想哥的戒烟数据（请按实际情况修改） ==========
    const QUIT_DATE = new Date(2026, 4, 29);   // 想哥开始戒烟日期：2026年5月29日（月份减1）
    const CIGS_PER_DAY = 20;                    // 想哥之前每天4支
    const PRICE_PER_PACK = 16;                 // 每包25元
    const CIGS_PER_PACK = 20;                  // 每包20支
    const PERMANENT_DAYS = 3650;               // 永久目标（10年）

    // 戒断期阶段说明（详细版）
    const WITHDRAWAL_STAGES = [
        { hours: 12, label: '戒烟12小时', title: '身体开始自我修复', desc: '血液中尼古丁含量降至吸烟前的一半，身体开始启动排毒程序。心率和血压开始下降，身体正在努力清除有害物质。' },
        { hours: 24, label: '戒烟24小时', title: '戒断反应高峰期', desc: '身体内的尼古丁基本清除完毕，戒断反应可能达到顶峰。可能出现烦躁、焦虑、易怒、渴望吸烟等症状。这是最艰难的时刻，请坚持住！' },
        { hours: 48, label: '戒烟48小时', desc: '嗅觉味觉恢复', title: '嗅觉和味觉开始逐渐恢复灵敏度，能够闻到以前无法察觉的气味，品尝食物更加美味。血液循环开始改善。' },
        { hours: 72, label: '戒烟72小时', title: '身体彻底排毒', desc: '身体内的尼古丁已完全排出。戒断症状开始减轻，精力和体力开始恢复。肺部纤毛开始恢复功能，帮助清除肺部粘液。' },
        { days: 1, label: '第1天', title: '一氧化碳水平正常', desc: '血液中的一氧化碳水平恢复正常，身体获得更多氧气。心脏负担减轻，呼吸变得更加顺畅。' },
        { days: 2, label: '第2天', title: '感官明显改善', desc: '嗅觉和味觉显著改善，能够享受食物的真实味道。呼吸更清新，咳嗽减少。身体正在快速恢复中。' },
        { days: 3, label: '第3天', title: '能量大幅提升', desc: '身体不再消耗大量能量来代谢尼古丁，精力明显增加。肺功能开始改善，运动耐力提升。' },
        { days: 7, label: '第1周', title: '一周胜利！', desc: '恭喜完成第一周！肺功能改善约30%，咳嗽和气短减少。心脏病发作风险开始降低。身体已经适应无烟状态。' },
        { days: 14, label: '第2周', title: '精力充沛', desc: '血液循环显著改善，皮肤开始变得红润有光泽。肺功能持续提升，运动时呼吸更轻松。' },
        { days: 30, label: '第1个月', title: '一个月里程碑！', desc: '肺功能大幅改善，心脏病风险比吸烟时降低50%。咳嗽、咳痰减少，肺活量增加。身体已经完全适应无烟生活。' },
        { days: 90, label: '第3个月', title: '长期胜利！', desc: '肺功能恢复约50%-80%，患肺癌风险开始下降。呼吸系统感染减少，整体健康状况明显改善。' },
        { days: 365, label: '第1年', title: '一年成就！', desc: '心脏病发作风险降低至吸烟者的一半以下，肺癌风险显著降低。肺功能持续改善，预期寿命延长。恭喜你获得新生！' }
    ];

    // 祝福语库（可随意增删）
    const BLESSINGS = [
        "❤️ 祝想哥戒烟成功！每一天都是胜利 ❤️",
        "💪 想哥最棒！一天比一天更健康！",
        "🌟 每一颗爱心，都是我对你的鼓励！",
        "🍀 戒烟不易，但你并不孤单，加油！",
        "🎉 30天，90天，永久……我陪你一起见证！",
        "💖 少抽一支烟，多一份我们的未来。",
        "🏆 想哥是真正的勇士，战胜烟瘾！",
        "🌿 清新的空气，健康的心肺，值得拥有。",
        "📈 看着爱心一天天填满，超有成就感！",
        "✨ 你的坚持，让我骄傲。",
        "🔥 戒断反应不可怕，你会越来越轻松。",
        "💞 想哥，我永远支持你！"
    ];

    let currentGoalDays = 30;
    let userSelectedGoal = false;  // 标记用户是否手动选择了目标

    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 200;
    canvas.height = 180;

    function drawHeart(fillPercent) {
        fillPercent = Math.min(1, Math.max(0, fillPercent));
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.beginPath();
        const x = canvas.width / 2;
        const y = canvas.height / 2 + 5;
        const size = 70;
        
        ctx.moveTo(x, y + size * 0.35);
        ctx.bezierCurveTo(
            x - size * 0.55, y + size * 0.1,
            x - size * 0.8, y - size * 0.3,
            x, y - size * 0.6
        );
        ctx.bezierCurveTo(
            x + size * 0.8, y - size * 0.3,
            x + size * 0.55, y + size * 0.1,
            x, y + size * 0.35
        );
        ctx.closePath();
        
        ctx.save();
        ctx.clip();
        
        ctx.fillStyle = "#ffccd5";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        const heartTopY = y - size * 0.6;
        const heartBottomY = y + size * 0.35;
        const heartHeight = heartBottomY - heartTopY;
        const fillHeight = heartHeight * fillPercent;
        const fillRectY = heartBottomY - fillHeight;
        
        ctx.fillStyle = "#e63946";
        ctx.fillRect(0, fillRectY, canvas.width, heartBottomY);
        
        ctx.restore();
        
        ctx.beginPath();
        ctx.moveTo(x, y + size * 0.35);
        ctx.bezierCurveTo(
            x - size * 0.55, y + size * 0.1,
            x - size * 0.8, y - size * 0.3,
            x, y - size * 0.6
        );
        ctx.bezierCurveTo(
            x + size * 0.8, y - size * 0.3,
            x + size * 0.55, y + size * 0.1,
            x, y + size * 0.35
        );
        ctx.strokeStyle = "#ffecb3";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(x - 12, y - 20, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff80";
        ctx.fill();
    }

    function getDaysQuit() {
        const today = new Date();
        const start = new Date(QUIT_DATE.getFullYear(), QUIT_DATE.getMonth(), QUIT_DATE.getDate());
        const now = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        return diff >= 0 ? diff : 0;
    }

    function getHoursQuit() {
        const now = new Date();
        const quitTime = new Date(QUIT_DATE);
        const diff = now - quitTime;
        if (diff < 0) return 0;
        return Math.floor(diff / (1000 * 60 * 60));
    }

    function updateWithdrawalStages() {
        const hoursQuit = getHoursQuit();
        const container = document.getElementById('currentStage');

        let currentStage = WITHDRAWAL_STAGES[0];
        for (let i = 0; i < WITHDRAWAL_STAGES.length; i++) {
            const stageHours = WITHDRAWAL_STAGES[i].hours || (WITHDRAWAL_STAGES[i].days * 24);
            const nextStageHours = (i < WITHDRAWAL_STAGES.length - 1) 
                ? (WITHDRAWAL_STAGES[i + 1].hours || WITHDRAWAL_STAGES[i + 1].days * 24)
                : Infinity;
            
            if (hoursQuit >= stageHours && hoursQuit < nextStageHours) {
                currentStage = WITHDRAWAL_STAGES[i];
                break;
            }
            
            if (i === WITHDRAWAL_STAGES.length - 1 && hoursQuit >= stageHours) {
                currentStage = WITHDRAWAL_STAGES[i];
                break;
            }
        }

        container.innerHTML = `
            <div class="withdrawal-stage-label">📅 ${currentStage.label}</div>
            <div class="withdrawal-stage-title">${currentStage.title}</div>
            <div class="withdrawal-stage-desc">${currentStage.desc}</div>
        `;
    }

    function getGoalDescription() {
        if (currentGoalDays === PERMANENT_DAYS) return "🌟 永久戒烟 (10年)";
        else if (currentGoalDays === 90) return "🏆 长期目标 · 90天";
        else return "🎯 短期目标 · 30天";
    }

    let blessingIndex = 0;

    function showNextBlessing() {
        const el = document.getElementById('blessingText');
        el.classList.add('fade-out');
        el.classList.remove('fade-in');
        setTimeout(() => {
            blessingIndex = (blessingIndex + 1) % BLESSINGS.length;
            el.innerHTML = BLESSINGS[blessingIndex];
            el.classList.remove('fade-out');
            el.classList.add('fade-in');
        }, 500);
    }

    function updateTimer() {
        const now = new Date();
        const quitTime = new Date(QUIT_DATE);
        const diff = now - quitTime;
        
        if (diff < 0) {
            document.getElementById('timerDays').innerText = '00';
            document.getElementById('timerHours').innerText = '00';
            document.getElementById('timerMins').innerText = '00';
            document.getElementById('timerSecs').innerText = '00';
            return;
        }
        
        const totalSeconds = Math.floor(diff / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const mins = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;
        
        document.getElementById('timerDays').innerText = String(days).padStart(2, '0');
        document.getElementById('timerHours').innerText = String(hours).padStart(2, '0');
        document.getElementById('timerMins').innerText = String(mins).padStart(2, '0');
        document.getElementById('timerSecs').innerText = String(secs).padStart(2, '0');
    }

    function refreshWidget() {
        const days = getDaysQuit();
        const hours = getHoursQuit();
        const daysDecimal = hours / 24;
        
        document.getElementById('dayCount').innerText = `第${days}天`;
        
        if (!userSelectedGoal) {
            if (days >= 90 && currentGoalDays !== PERMANENT_DAYS) {
                currentGoalDays = PERMANENT_DAYS;
                document.querySelectorAll('.goal-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-goal') === 'permanent');
                });
            } else if (days >= 30 && days < 90 && currentGoalDays === 30) {
                currentGoalDays = 90;
                document.querySelectorAll('.goal-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-goal') === '90');
                });
            }
        }
        
        let percent = (daysDecimal / currentGoalDays) * 100;
        if (currentGoalDays === PERMANENT_DAYS && days >= PERMANENT_DAYS) percent = 100;
        percent = Math.min(100, Math.max(0, percent));
        const percentInt = Math.floor(percent);
        
        document.getElementById('progressPercent').innerText = percentInt + '%';
        document.getElementById('heartPercentText').innerText = percentInt + '%';
        document.getElementById('targetDesc').innerHTML = `当前目标: ${getGoalDescription()}`;
        
        drawHeart(percent / 100);
        
        const avoided = Math.floor(daysDecimal * CIGS_PER_DAY);
        const saved = (avoided / CIGS_PER_PACK) * PRICE_PER_PACK;
        document.getElementById('avoidedCigs').innerText = avoided;
        document.getElementById('savedMoney').innerText = saved.toFixed(1);
        
        const tipDiv = document.getElementById('healthTip');
        let tipMsg = "";
        if (days >= 90) {
            tipMsg = `🎉 想哥太棒了！已戒烟 ${days} 天，成功达成90天长期目标！正向永久迈进！爱心已几乎满溢。`;
        } else if (days >= 30) {
            tipMsg = `🎉 恭喜想哥完成30天短期目标！当前第${days}天，继续向90天进发！心跳为你加油。`;
        } else if (days >= 4) {
            tipMsg = `❤️ 想哥加油！第${days}天：尼古丁代谢干净，爱心填充 ${percentInt}% ，坚持到30天就是第一个胜利！`;
        } else if (days === 3) {
            tipMsg = `💪 想哥第3天：呼吸变顺畅，爱心进度 ${percentInt}% ，最难时刻即将过去。`;
        } else if (days === 2) {
            tipMsg = `👃 想哥第2天：味觉嗅觉改善。爱心填充 ${percentInt}% ，继续加油！`;
        } else if (days === 1) {
            tipMsg = `❤️ 想哥第1天：一氧化碳恢复正常。爱心开始被填满～`;
        } else if (hours > 0) {
            tipMsg = `🔥 想哥，已戒烟 ${hours} 小时！迈出了戒烟的第一步，坚持住！爱心正在慢慢填满 ${percentInt}%`;
        } else {
            tipMsg = `🚀 想哥，戒烟之旅即将开始！设定30天目标，让我们一起见证你的每一步胜利！`;
        }
        
        if (percent >= 100 && currentGoalDays !== PERMANENT_DAYS) {
            tipMsg += `<br>✅ 恭喜想哥完成当前目标！可以点击上方按钮挑战更高目标（90天或永久）。`;
        } else if (currentGoalDays === PERMANENT_DAYS && days >= PERMANENT_DAYS) {
            tipMsg += `<br>🏆 想哥已经坚持戒烟10年！永久戒烟成功，你是真正的英雄！`;
        }
        tipDiv.innerHTML = tipMsg;
    }

    function setGoal(goalType) {
        if (goalType === '30') currentGoalDays = 30;
        else if (goalType === '90') currentGoalDays = 90;
        else if (goalType === 'permanent') currentGoalDays = PERMANENT_DAYS;
        
        document.querySelectorAll('.goal-btn').forEach(btn => {
            if (btn.getAttribute('data-goal') === goalType) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        if (goalType !== 'auto') {
            userSelectedGoal = true;  // 用户手动选择了目标
        }
        refreshWidget();
    }
    
    document.querySelectorAll('.goal-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const goal = btn.getAttribute('data-goal');
            setGoal(goal);
        });
    });

    function selectAppropriateGoal() {
        const days = getDaysQuit();
        if (days >= 90) {
            setGoal('permanent');
        } else if (days >= 30) {
            setGoal('90');
        } else {
            setGoal('30');
        }
    }

    selectAppropriateGoal();
    updateTimer();
    updateWithdrawalStages();
    setInterval(updateTimer, 1000);
    setInterval(showNextBlessing, 5000);
    setInterval(() => {
        refreshWidget();
        updateWithdrawalStages();
    }, 3600000);
</script>
</body>
</html>
